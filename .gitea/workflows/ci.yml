# Continuous integration, run by Gitea Actions.
#
# The two jobs answer the two questions a change has to answer: does the program
# still build and pass its tests, and do the packages still come out right. The
# second one installs the tools of the formats and then runs the same "packages"
# and "verify" tasks a release is cut with, so what is checked here is what would
# be published.
#
# Both jobs run inside the Go image rather than on whatever the runner happens to
# have, because the toolchain version is part of what is being checked and the
# image is a Debian with git and dpkg in it already.
#
# Every step here is a command of that image. The familiar actions/checkout is
# not one of them: it is a JavaScript action and needs node in the container,
# which this image has not, so the job used to fail before it checked anything.
# The repository is fetched with git instead, from this instance rather than from
# github.com, so nothing outside the instance is needed to run this.
name: CI

# The token of the run is allowed to write to the repository because the last
# step of the packaging job writes a release. That step runs when a tag was
# pushed and never otherwise, and everything before it only reads.
permissions:
  contents: write

# A tag is what this runs on, and nothing else. The two jobs answer the question a
# release has to answer, and that question is worth asking exactly where it is
# answered: what is checked here is what is about to be published. Every push
# built the program, packed every format and verified them a second time, which is
# a lot of the runner's time for a change that is often a line of prose. A branch
# is checked from the checkout instead, with the same tasks:
# go run ./tools/build test, packages, verify.
on:
  push:
    tags: ["v*"]

# The address the jobs fetch from and publish to. It is named here rather than
# taken from github.server_url, which is the address the instance gives itself:
# that is the name it answers to inside its own deployment, one no container of
# a job can resolve.
env:
  INSTANCE: https://git.zqlhub.com
  # Where the job installs the tools of the formats from. The image's own
  # sources are Debian's, which answered from far away here: four small packages
  # took minutes. The runner is a machine of the instance's own, so this names
  # the mirror it reaches over the internal network, which answers at once and
  # is not billed as traffic. The step puts the image's own sources back when
  # this one does not answer, so a runner outside that network is neither slower
  # nor broken there.
  DEBIAN_MIRROR: mirrors.tencentyun.com

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      # The tags are fetched as well as the history, since the version a release
      # is named after is read from the tag in front of the checkout, and the
      # test that holds the sources to that tag has nothing to compare against
      # without it.
      - name: check out the sources
        env:
          # The token of the run goes by one of these names, depending on the
          # version and how the instance provides it. The ones that are not set
          # expand to nothing, and no token at all is reported here rather than
          # left to a fetch that cannot read the repository.
          TOKEN_CONTEXT: ${{ github.token }}
          TOKEN_SECRET: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_GITEA: ${{ secrets.GITEA_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          token="${TOKEN_CONTEXT:-${TOKEN_SECRET:-${TOKEN_GITEA:-}}}"
          if [ -z "$token" ]; then
            echo "this run has no token to fetch the repository with"
            exit 1
          fi

          host=${INSTANCE#http://}
          host=${host#https://}
          url="https://oauth2:${token}@${host}/${REPO}.git"

          # The runner may or may not have left a checkout in the working
          # directory, so init is run either way, which is harmless, and the
          # remote is added or pointed at the repository again.
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch --force --tags origin "$REF"
          git checkout -q -f FETCH_HEAD

      # gofmt reports what it would change and still exits 0, so the list is
      # what decides.
      - name: the sources are formatted
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet and test
        run: go run ./tools/build test

  packages:
    runs-on: ubuntu-latest
    container: golang:1.26
    steps:
      # The same checkout as the other job, for the same reason: every package
      # and the program inside it are named after the tag this checkout carries,
      # so the tags have to be here. Without them the build would fall back on
      # the version in the sources, and a release would be attached under a name
      # the manifests do not point at.
      - name: check out the sources
        env:
          TOKEN_CONTEXT: ${{ github.token }}
          TOKEN_SECRET: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_GITEA: ${{ secrets.GITEA_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          token="${TOKEN_CONTEXT:-${TOKEN_SECRET:-${TOKEN_GITEA:-}}}"
          if [ -z "$token" ]; then
            echo "this run has no token to fetch the repository with"
            exit 1
          fi

          host=${INSTANCE#http://}
          host=${host#https://}
          url="https://oauth2:${token}@${host}/${REPO}.git"

          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch --force --tags origin "$REF"
          git checkout -q -f FETCH_HEAD

      # What the packaging and the checking need beyond the Go toolchain: an
      # rpm, a bsdtar to read the Arch package with, and one of the two
      # compressors that package wants, which the standard library cannot write.
      # dpkg-deb, which reads the deb and the ipk, is in the base image.
      #
      # The sources of the image are pointed at the mirror by the function in
      # .gitea/scripts/apt-mirror.sh, which is sourced because a function
      # defined in one step is gone by the next, and which leaves the sources
      # where they are when the mirror cannot be reached. What is asked of
      # apt-get below is the other way this can go wrong: a mirror that answers
      # but carries no such suite, which is an error rather than a warning.
      # Either way the image's own sources end up in place, so a runner outside
      # the network of the mirror is neither slower nor broken.
      - name: install the tools of the formats
        run: |
          set -eu
          . .gitea/scripts/apt-mirror.sh
          pointAptAtMirror

          if ! apt-get update -qq; then
            echo "the sources of $DEBIAN_MIRROR could not be read, going back to the image's own sources"
            for f in $aptSourcesFiles; do
              [ -f "$f" ] || continue
              sed -i "s|$DEBIAN_MIRROR|deb.debian.org|g" "$f"
            done
            apt-get update
          fi

          apt-get install -y --no-install-recommends rpm libarchive-tools xz-utils zstd

      - name: pack every format
        run: go run ./tools/build packages

      # Every package is read back with the tool that installs it, and everything
      # is then packed a second time to see whether a release built twice is the
      # same release.
      - name: check every package
        run: go run ./tools/build verify

      # What was packed is not uploaded anywhere: that would take another
      # JavaScript action, which this image cannot run either. The packages are
      # kept when they are published, which is what matters, and a run that stops
      # before that leaves them in its working directory.

      - name: the tools to publish with
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apt-get install -y --no-install-recommends curl jq

      # A tag makes a release. The version of the release is read from that tag,
      # so the packages and the manifests that point at
      # <address>/releases/download/v<version>/<file> agree by construction, and
      # what is left to check is that the version still comes from the tag at all:
      # a derivation that quietly fell back on the sources would attach files
      # under names the manifests do not name. Whether the sources still carry the
      # version of the tag is a test in the other job.
      #
      # This instance keeps two attachments of the same name rather than replacing
      # the first, so a tag that is pushed twice - a release cut again after the
      # sources were fixed, a job re-run after a failure - used to leave the
      # release with two of every file. Each name is therefore looked for among
      # the attachments the release already carries and deleted before the upload,
      # which makes this step leave one of each however many times it runs. It is
      # not skipped when the release is already there, since a run that stopped
      # halfway must be able to finish, and a tag that was moved needs what it
      # published replaced rather than kept.
      #
      # Something already attached is the one sign that this tag has been
      # published before, and it is said out loud: the usual reason is a tag that
      # was moved and pushed again, which is a release wearing the version of the
      # one before it.
      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN_CONTEXT: ${{ github.token }}
          TOKEN_SECRET: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_GITEA: ${{ secrets.GITEA_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          if [ ! -f "dist/packages/sdautologin_${version}-1_amd64.deb" ]; then
            echo "there is no package for $version:"
            echo "the packages are named after the tag they were built at, and this build did not name this one"
            exit 1
          fi

          # What the release says is the section CHANGELOG.md holds for this tag,
          # read out of it rather than written down a second time. A tag with no
          # section is refused: a release whose notes are empty is worse than a
          # run that stops and says what to add.
          notes=$(awk -v want="$TAG" '
            $1 == "##" {
              if (seen) exit
              if ($2 == want) { seen = 1; next }
            }
            seen && !started && $0 ~ /^[[:space:]]*$/ { next }
            seen { started = 1; print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md holds no section for $TAG:"
            echo "the body of the release is read out of it, so add one and push the tag again"
            exit 1
          fi

          token="${TOKEN_CONTEXT:-${TOKEN_SECRET:-${TOKEN_GITEA:-}}}"
          if [ -z "$token" ]; then
            echo "this run has no token to write a release with"
            exit 1
          fi
          auth="Authorization: token $token"
          api="$INSTANCE/api/v1/repos/$REPO/releases"

          # The release of this tag, or a new one. Pushing a tag twice, or
          # creating the release by hand first, must not fail the run. The answer
          # is kept whole rather than read for its id alone, since the attachments
          # it already carries are read out of it below.
          release=$(curl -sS -H "$auth" "$api/tags/$TAG")
          id=$(printf '%s' "$release" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            release=$(curl -sS -X POST \
              -H "$auth" -H "Content-Type: application/json" \
              -d "$(jq -n --arg tag "$TAG" --arg body "$notes" \
                    '{tag_name: $tag, name: $tag, draft: false, prerelease: false,
                      body: $body}')" \
              "$api")
            id=$(printf '%s' "$release" | jq -r '.id // empty')
          else
            # A release that is already there keeps the id it has and is told what
            # the changelog says now: a tag pushed again after its notes were
            # corrected would otherwise go on showing the text of the first run.
            curl -sS -X PATCH \
              -H "$auth" -H "Content-Type: application/json" \
              -d "$(jq -n --arg body "$notes" '{body: $body}')" \
              "$api/$id" >/dev/null
          fi
          if [ -z "$id" ]; then
            echo "no release of $TAG could be reached or created:"
            echo "check that the token of this run may write to the repository"
            exit 1
          fi

          # Said before anything is replaced, because it is the only sign of the
          # thing that used to leave two of every file behind.
          already=$(printf '%s' "$release" | jq -r '.assets | length')
          if [ "$already" != "0" ]; then
            echo "$TAG has been published before: the release already carries $already attachment(s)"
            printf '%s' "$release" | jq -r '"  newest of them: " + (.assets | map(.created_at) | max)'
            echo "  the files below replace the ones of the same name, and the release is left with one of each"
          fi

          # The packages and SHA256SUMS as the attachments of the release, where
          # the two manifests say they are.
          attached=0
          replaced=0
          for file in dist/packages/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")

            # Every attachment already carrying this name goes. There is normally
            # one, when a tag has been published more than once; a release that
            # was doubled before this step replaced rather than deleted has two,
            # and both of them go.
            for old in $(printf '%s' "$release" | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id'); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" "$api/$id/assets/$old")
              case "$code" in
                200|204) replaced=$((replaced + 1)) ;;
                *) echo "the attachment $old of $name could not be deleted (HTTP $code): the upload below may leave two of it" ;;
              esac
            done

            curl -sS -H "$auth" -F "attachment=@$file" "$api/$id/assets?name=$name" \
              | jq -r '"  " + (.name // .message)'
            attached=$((attached + 1))
          done
          echo "attached $attached file(s), replacing $replaced earlier attachment(s) of the same names"

      # The wiki is a repository of its own, so its pages are written from here:
      # the manual and the changelog are the files the repository already holds,
      # and the landing page and the sidebar come from docs/wiki/. It is best
      # effort - a wiki that cannot be written to is not a reason to fail a release
      # that has been published already - but it says what happened either way.
      - name: update the wiki
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN_CONTEXT: ${{ github.token }}
          TOKEN_SECRET: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_GITEA: ${{ secrets.GITEA_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          token="${TOKEN_CONTEXT:-${TOKEN_SECRET:-${TOKEN_GITEA:-}}}"
          host=${INSTANCE#http://}
          host=${host#https://}
          url="https://oauth2:${token}@${host}/${REPO}.wiki.git"

          if ! git clone --quiet "$url" /tmp/wiki; then
            echo "the wiki could not be cloned: is it enabled, and may this run write to it?"
            exit 0
          fi

          sh ./.gitea/scripts/wiki-pages.sh . /tmp/wiki

          cd /tmp/wiki
          # A wiki nobody has written to yet comes back with no branch at all, and
          # the push is what creates it; one that has been written to is on the
          # branch Gitea made for it.
          branch=$(git symbolic-ref --short -q HEAD || echo master)
          git add -A
          if git diff --cached --quiet; then
            echo "the wiki is already up to date"
            exit 0
          fi
          git -c user.name=SDAutoLogin -c user.email=sdautologin@localhost \
            commit --quiet -m "Pages from $TAG"
          if git push --quiet origin "HEAD:$branch"; then
            echo "the wiki was updated from $TAG"
          else
            echo "the wiki could not be pushed to: the token of this run may not write to it"
          fi
